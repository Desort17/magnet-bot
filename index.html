<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Magnet Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e9ec;--ink:#1c1d24;--blue:#2f6fe4;--chip:#fff;--line:#cfd0d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
header{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;pointer-events:none}
h1{font-size:18px;margin:0;font-weight:600}
#status{font-size:13px;margin:4px 0 0;opacity:.7;min-height:1.2em}
#ui{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:10px;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;transition:transform .12s,background .12s}
button:hover{background:#f6f7fb}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.main{font-weight:600;padding:11px 22px}
.chat{display:flex;gap:8px;width:min(560px,100%)}
.chat input{flex:1;min-width:0;font:inherit;font-size:14px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.chat input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#reply{font-size:15px;font-weight:600;max-width:520px;margin:10px 0 0;min-height:1.3em}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="3D magnetic bot. Drag to rotate."></canvas>
<header><h1>Magnet Bot</h1><p id="status">Ready. Press Split, or turn on the mic and say “split”.</p><p id="reply"></p></header>
<div id="ui">
  <div class="chat"><input id="msg" type="text" placeholder="Talk to the bot…" aria-label="Message to the bot" autocomplete="off"><button id="bSend">Send</button></div>
  <div class="row" id="moods"></div>
  <div class="row">
    <button class="main" id="bSplit">Split</button>
    <button class="main" id="bJoin">Join</button>
    <button id="bMic">Mic off</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const V3=THREE.Vector3, Q=THREE.Quaternion;
const cv=document.getElementById('c'), statusEl=document.getElementById('status');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));
R.outputEncoding=THREE.sRGBEncoding; R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.05;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(35,1,.1,100);

// Studio reflection map (soft boxes), so the black gloss shows sharp white highlights
(function(){
  const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,512);g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#cfd0d6');g.addColorStop(1,'#5c5d66');
  x.fillStyle=g;x.fillRect(0,0,1024,512);
  x.fillStyle='#fff';[[120,80,220,130],[560,60,260,110],[820,170,140,160],[330,200,90,120]].forEach(r=>x.fillRect(...r));
  x.fillStyle='#2a2b33';x.fillRect(0,330,1024,26);
  const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;scene.environment=t;
})();
const key=new THREE.DirectionalLight(0xffffff,1.2);key.position.set(-4,8,8);scene.add(key);
scene.add(new THREE.AmbientLight(0xffffff,.35));

const blackMat=new THREE.MeshPhysicalMaterial({color:0x0b0b12,metalness:.25,roughness:.1,clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.7});
const spikeMat=new THREE.MeshPhysicalMaterial({color:0x1b1b2a,metalness:.45,roughness:.22,clearcoat:.8,flatShading:true,envMapIntensity:1.6});
const root=new THREE.Group();scene.add(root);

// soft ground shadow
const sh=document.createElement('canvas');sh.width=sh.height=128;
(function(){const x=sh.getContext('2d'),g=x.createRadialGradient(64,64,4,64,64,64);g.addColorStop(0,'rgba(0,0,0,.35)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);})();
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(7,2.2),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sh),transparent:true,depthWrite:false}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=-4.3;scene.add(shadow);

const parts=[];
function addPart(obj,home,spinScale){
  obj.position.copy(home);root.add(obj);
  const dir=new V3(Math.random()-.5,Math.random()-.2,Math.random()-.5).normalize();
  parts.push({o:obj,home:home.clone(),hq:obj.quaternion.clone(),vel:new V3(),off:dir.multiplyScalar(2.2+Math.random()*1.6),
    axis:new V3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize(),spin:(1+Math.random()*2)*(spinScale||1),ph:Math.random()*6.28});
}
function ball(r){return new THREE.Mesh(new THREE.SphereGeometry(r,48,32),blackMat)}

// Body: head, chest, belly
const head=new THREE.Group();head.add(ball(.82));
addPart(head,new V3(0,1.25,0),.4);
const chest=ball(.98);addPart(chest,new V3(0,-.1,0),.8);
const belly=ball(.8);addPart(belly,new V3(0,-1.35,0),.8);

// Face (blue emoji on the head)
const fc=document.createElement('canvas');fc.width=fc.height=256;const fx=fc.getContext('2d');
const faceTex=new THREE.CanvasTexture(fc);faceTex.encoding=THREE.sRGBEncoding;
const face=new THREE.Mesh(new THREE.SphereGeometry(.835,48,32,Math.PI/2-.8,1.6,Math.PI/2-.8,1.6),new THREE.MeshBasicMaterial({map:faceTex,transparent:true,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4,depthWrite:false}));
face.renderOrder=5;head.add(face);

// Six spike limbs, each on its own ball joint
function limb(joint,dir){
  const g=new THREE.Group();g.add(ball(.5));
  const geo=new THREE.CylinderGeometry(.12,.62,2.7,6,1);
  const sp=new THREE.Mesh(geo,spikeMat);sp.position.y=1.55;g.add(sp);
  const ed=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0x9a9ab4,transparent:true,opacity:.75}));
  ed.position.y=1.55;g.add(ed);
  g.quaternion.setFromUnitVectors(new V3(0,1,0),new V3(dir[0],dir[1],0).normalize());
  addPart(g,new V3(joint[0],joint[1],0),1.2);
}
limb([-.9,1.75],[-.55,.85]);limb([.95,1.6],[.75,.62]);
limb([-1.05,-.05],[-1,.2]);limb([1.1,.05],[.9,.42]);
limb([-.85,-1.5],[-.6,-.8]);limb([.85,-1.65],[.5,-.85]);

// Face moods
const MOODS={
  normal:{eye:1,tilt:0,by:0,smile:.3,open:0},
  happy:{eye:.85,tilt:-.2,by:-6,smile:1,open:.55},
  surprised:{eye:1.25,tilt:-.3,by:-16,smile:0,open:.9},
  angry:{eye:.6,tilt:1,by:4,smile:-.7,open:.25},
  scared:{eye:1.15,tilt:-.9,by:-8,smile:-.35,open:.6},
  sleepy:{eye:.14,tilt:0,by:6,smile:.15,open:0},
  focused:{eye:.55,tilt:.5,by:2,smile:0,open:0}
};
let cur=Object.assign({},MOODS.normal),goal=MOODS.normal,moodName='normal',blink=0,nextBlink=2,moodTimer=0;
function drawFace(){
  const x=fx,s=256;x.clearRect(0,0,s,s);
  x.save();x.beginPath();x.arc(128,128,126,0,6.283);x.clip();
  const g=x.createRadialGradient(100,84,10,128,128,130);g.addColorStop(0,'#7cc4ff');g.addColorStop(.55,'#2f78ea');g.addColorStop(1,'#1a47a8');
  x.fillStyle=g;x.fillRect(0,0,s,s);
  const e=cur.eye*(1-blink);
  [[90,112],[166,112]].forEach(p=>{
    x.fillStyle='#fff';x.beginPath();x.ellipse(p[0],p[1],27,Math.max(3,33*e),0,0,6.283);x.fill();
    if(e>.2){x.fillStyle='#10131c';x.beginPath();x.arc(p[0]+3,p[1]+2,Math.min(10,10*e+2),0,6.283);x.fill();}
  });
  x.strokeStyle='#0d1a3d';x.lineWidth=9;x.lineCap='round';
  const by=70+cur.by,t=cur.tilt*18;
  x.beginPath();x.moveTo(60,by);x.lineTo(114,by+t);x.stroke();
  x.beginPath();x.moveTo(196,by);x.lineTo(142,by+t);x.stroke();
  const y=178,cy=y+cur.smile*40;
  if(cur.open>.05){
    x.fillStyle='#10131c';x.beginPath();x.moveTo(84,y);x.quadraticCurveTo(128,cy,172,y);
    x.quadraticCurveTo(128,y+cur.open*46+Math.max(0,cur.smile)*8,84,y);x.fill();
  }else{x.beginPath();x.moveTo(88,y);x.quadraticCurveTo(128,cy,168,y);x.stroke();}
  x.restore();
  const hl=x.createRadialGradient(92,56,2,92,56,70);hl.addColorStop(0,'rgba(255,255,255,.45)');hl.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=hl;x.fillRect(0,0,s,s);
  faceTex.needsUpdate=true;
}
function setMood(n,hold){
  if(!MOODS[n])return;moodName=n;goal=MOODS[n];moodTimer=hold||0;if(hold===0)say('Mood: '+n);
  document.querySelectorAll('#moods button').forEach(b=>b.classList.toggle('on',b.dataset.m===n));
}

// Split / join
let split=false,snap=0,pulse=0;
function doSplit(){split=true;snap=0;setMood('scared',0);say('Split. All 10 parts are floating.');}
function doJoin(){split=false;snap=1;setMood('happy',2.2);say('Join. Parts snapping back.');}
function doSpin(){spinV=14;say('Spin.');}
let spinV=0;
function say(t){statusEl.textContent=t}

// UI
const mw=document.getElementById('moods');
Object.keys(MOODS).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.dataset.m=n;b.onclick=()=>setMood(n,0);mw.appendChild(b)});
document.getElementById('bSplit').onclick=doSplit;
document.getElementById('bJoin').onclick=doJoin;
setMood('normal');

// AI chat (talks to /api/chat, the key stays on the server)
const msgEl=document.getElementById('msg'),replyEl=document.getElementById('reply');let busy=false;
async function ask(text){
  if(!text||busy)return;busy=true;replyEl.textContent='…';setMood('focused',0);
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||('Server error '+r.status));
    replyEl.textContent=d.reply;
    if(d.action==='split')doSplit();else if(d.action==='join')doJoin();else if(d.action==='spin')doSpin();
    setMood(d.mood,4);
  }catch(e){replyEl.textContent='AI problem: '+e.message;setMood('sleepy',3)}
  busy=false;
}
function sendMsg(){const t=msgEl.value.trim();msgEl.value='';ask(t)}
document.getElementById('bSend').onclick=sendMsg;
msgEl.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});

// Drag to rotate
let drag=false,lx=0,ly=0,ry=0,rx=0;
cv.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>drag=false);
cv.addEventListener('pointermove',e=>{if(!drag)return;ry+=(e.clientX-lx)*.01;rx=Math.max(-.6,Math.min(.6,rx+(e.clientY-ly)*.006));lx=e.clientX;ly=e.clientY});

// Voice
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const bMic=document.getElementById('bMic');let rec=null,listening=false;
function command(t){
  t=t.toLowerCase();
  if(/\b(split|separate|break|apart)\b/.test(t))return doSplit();
  if(/\b(join|combine|assemble|together|back)\b/.test(t))return doJoin();
  if(/\bspin\b/.test(t))return doSpin();
  for(const n in MOODS){if(t.includes(n))return setMood(n,0)}
  if(/\b(angry|mad)\b/.test(t))return setMood('angry',0);
  if(/\b(sad|afraid)\b/.test(t))return setMood('scared',0);
  if(/\b(smile|good|great)\b/.test(t))return setMood('happy',0);
  ask(t);
}
if(!SR){bMic.disabled=true;bMic.textContent='Mic not supported';}
else bMic.onclick=()=>{
  if(listening){listening=false;rec&&rec.stop();bMic.textContent='Mic off';bMic.classList.remove('on');return}
  rec=new SR();rec.continuous=true;rec.interimResults=false;rec.lang='en-US';
  rec.onresult=e=>{const t=e.results[e.results.length-1][0].transcript.trim();say('Heard: “'+t+'”');command(t)};
  rec.onerror=e=>{if(e.error==='aborted'||e.error==='no-speech')return;say('Mic problem: '+e.error+(e.error==='not-allowed'?' (allow microphone access)':''));if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;bMic.textContent='Mic off';bMic.classList.remove('on')}};
  rec.onend=()=>{if(listening)setTimeout(()=>{try{rec.start()}catch(_){}},400)};
  try{rec.start();listening=true;bMic.textContent='Mic on';bMic.classList.add('on');say('Listening. Say split, join, spin, or a mood.')}catch(_){say('Could not start the mic.')}
};

function resize(){
  const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;
  const a=w/h;cam.position.set(0,.3,15*Math.max(1,1/(a*1.05)));cam.lookAt(0,-.2,0);cam.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock(),tmpQ=new Q(),tmpV=new V3();
function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  // face
  nextBlink-=dt;if(nextBlink<0){blink=1;nextBlink=2+Math.random()*3}
  blink=Math.max(0,blink-dt*8);
  for(const k in cur)cur[k]+=(goal[k]-cur[k])*(1-Math.exp(-9*dt));
  if(moodTimer>0){moodTimer-=dt;if(moodTimer<=0)setMood('normal',0)}
  drawFace();
  // parts
  let maxD=0;
  parts.forEach(p=>{
    tmpV.copy(p.home);
    if(split){tmpV.addScaledVector(p.off,1);tmpV.y+=Math.sin(t*1.3+p.ph)*.35;tmpV.x+=Math.cos(t*.9+p.ph)*.25}
    p.vel.addScaledVector(tmpV.sub(p.o.position),70*dt);
    p.vel.multiplyScalar(Math.exp(-(split?5:7)*dt));
    p.o.position.addScaledVector(p.vel,dt);
    if(split)p.o.rotateOnAxis(p.axis,p.spin*dt*.6);
    else p.o.quaternion.slerp(p.hq,1-Math.exp(-10*dt));
    maxD=Math.max(maxD,p.o.position.distanceTo(p.home));
  });
  if(snap&&!split&&maxD<.08){snap=0;pulse=1}
  pulse=Math.max(0,pulse-dt*4);
  const sc=1+Math.sin(pulse*Math.PI)*.06;root.scale.setScalar(sc);
  // root
  spinV*=Math.exp(-2.2*dt);ry+=spinV*dt;
  root.rotation.y+=(ry-root.rotation.y)*(1-Math.exp(-12*dt));
  root.rotation.x+=(rx-root.rotation.x)*(1-Math.exp(-8*dt));
  root.position.y=Math.sin(t*1.6)*.12;
  shadow.material.opacity=split?.55:.9;
  R.render(scene,cam);requestAnimationFrame(frame);
}
frame();
})();
</script>
</body>
</html>
